[project]
name = "keyantong-rnaseq"
version = "0.1.0"
description = "One-click RNAseq downstream: matrix + groups -> DE + plots"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.scripts]
keyantong-rnaseq = "keyantong_rnaseq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyantong_rnaseq"]
