name: 功能建议
description: 提议新能力或改进（大功能请先讨论）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 不涉及盗版文献分发或破解软件
          required: true
        - label: 已阅读 docs/01-product-vision.md 的 Non-Goals
          required: true
