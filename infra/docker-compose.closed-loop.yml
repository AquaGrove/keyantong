# Apply after docker-compose.conversation.yml. The model credential only reaches the bridge.
services:
  portal:
    image: keyantong-portal:closed-loop-20261105
    env_file:
      - path: ${KT_STORAGE_SECRETS_DIR:-/data/keyantong/storage-secrets}/harness-portal.env
        format: raw
    environment:
      HARNESS_WORKER_TOKEN: !reset null
      HARNESS_WORKER_URL: !reset null
      DSH_LLM_API_KEY: ""
      DSH_LLM_BASE_URL: ""
      NCBI_RELAY_ROOT: /data/ncbi-relay
    volumes:
      - ${KEYANTONG_DATA_ROOT:-/data/keyantong}/ncbi-relay:/data/ncbi-relay
  rnaseq-worker:
    image: keyantong-rnaseq-worker:closed-loop-20261105
  research-harness:
    build:
      context: ./harness
    image: keyantong-harness-workers:closed-loop-20261105
    entrypoint: ["node", "/opt/dsh/worker-bridge.mjs"]
    restart: unless-stopped
    env_file:
      - path: ${KT_STORAGE_SECRETS_DIR:-/data/keyantong/storage-secrets}/harness-bridge.env
        format: raw
    networks: [kt]
    volumes:
      - ${KEYANTONG_DATA_ROOT:-/data/keyantong}/harness-workers:/data/workers
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    pids_limit: 128
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090/health',{headers:{Authorization:'Bearer '+process.env.HARNESS_WORKER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
