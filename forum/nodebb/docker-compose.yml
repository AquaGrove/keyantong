services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:latest
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      url: ${NODEBB_URL:-http://localhost:4567}
    volumes:
      - nodebb_build:/usr/src/app/build
      - nodebb_public:/usr/src/app/public
      - nodebb_uploads:/usr/src/app/public/uploads
    depends_on:
      - mongo
      - redis-forum

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - nodebb_mongo:/data/db

  redis-forum:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - nodebb_redis:/data

volumes:
  nodebb_build:
  nodebb_public:
  nodebb_uploads:
  nodebb_mongo:
  nodebb_redis:
